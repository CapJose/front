<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Retirar USDC - Trust Wallet</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0d1117;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 600px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 30px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #8b949e;
            margin-bottom: 25px;
        }

        .info {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .label {
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .value {
            word-break: break-all;
            font-family: monospace;
        }

        .balance {
            font-size: 28px;
            font-weight: bold;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2f81f7;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            margin-top: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #connectBtn {
            background: #3375bb;
            color: white;
        }

        #withdrawBtn {
            background: #238636;
            color: white;
        }

        #withdrawAllBtn {
            background: #da3633;
            color: white;
        }

        #maxBtn {
            width: auto;
            padding: 8px 14px;
            background: #30363d;
            color: white;
            font-size: 13px;
        }

        #refreshBtn {
            background: #30363d;
            color: white;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            min-height: 55px;
            border-radius: 10px;
            border: 1px solid #30363d;
            background: #0d1117;
            line-height: 1.5;
            word-break: break-word;
        }

        .success {
            color: #3fb950;
        }

        .error {
            color: #f85149;
        }

        .warning {
            color: #d29922;
        }

        a {
            color: #58a6ff;
        }

        .small {
            margin-top: 15px;
            color: #8b949e;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>💵 Donation Wallet</h1>

    <div class="subtitle">
        Retiro de USDC mediante Trust Wallet
    </div>


    <div class="info">
        <div class="label">
            Wallet conectada
        </div>

        <div
            id="wallet"
            class="value"
        >
            No conectada
        </div>
    </div>


    <div class="info">
        <div class="label">
            Owner del contrato
        </div>

        <div
            id="owner"
            class="value"
        >
            -
        </div>
    </div>


    <div class="info">
        <div class="label">
            Contrato
        </div>

        <div
            id="contractAddress"
            class="value"
        >
            -
        </div>
    </div>


    <div class="info">
        <div class="label">
            Saldo disponible
        </div>

        <div class="balance">

            <span id="balance">
                -
            </span>

            USDC

        </div>
    </div>


    <button id="connectBtn">
        Conectar Trust Wallet
    </button>


    <button id="refreshBtn">
        Actualizar saldo
    </button>


    <label for="destination">
        Wallet destino
    </label>

    <input
        id="destination"
        type="text"
        placeholder="0x..."
        autocomplete="off"
    >


    <label for="amount">
        Cantidad de USDC
    </label>

    <input
        id="amount"
        type="text"
        inputmode="decimal"
        placeholder="Ejemplo: 5.50"
        autocomplete="off"
    >


    <button id="maxBtn">
        Usar máximo
    </button>


    <button
        id="withdrawBtn"
        disabled
    >
        Enviar USDC a wallet destino
    </button>


    <button
        id="withdrawAllBtn"
        disabled
    >
        Retirar TODO al Owner
    </button>


    <div id="status">
        Inicializando...
    </div>


    <div class="small">
        Las lecturas blockchain se realizan mediante un RPC independiente.
        Trust Wallet solamente se utiliza para autorizar y enviar la transacción.
    </div>

</div>


<script>

// ======================================================
// CONFIGURACIÓN
// ======================================================

const CONTRACT_ADDRESS =
    "0xacee485be365a309fe1d30696f34a6446cc9bfc4";


// ======================================================
// IMPORTANTE
// ======================================================
//
// Pon aquí un RPC DE ETHEREUM MAINNET que funcione.
//
// Ejemplo de estructura:
//
// https://eth-mainnet.g.alchemy.com/v2/TU_API_KEY
//
// o:
//
// https://mainnet.infura.io/v3/TU_API_KEY
//
// Para producción es preferible que estas lecturas
// pasen por tu backend para no exponer una API key.
//
// ======================================================

const READ_RPC_URL =
    "https://mainnet.infura.io/v3/2299d5a9f0e248bca4873f673fc68cfd";


const EXPECTED_CHAIN_ID =
    1n;


// ======================================================
// ABI DONATION WALLET
// ======================================================

const CONTRACT_ABI = [

    "function owner() view returns (address)",

    "function usdcToken() view returns (address)",

    "function getContractBalance() view returns (uint256)",

    "function withdrawDonations(address to,uint256 amount)",

    "function withdrawAll()",

    "event FundsWithdrawn(address indexed owner,uint256 amount)"

];


// ======================================================
// ABI ERC20
// ======================================================

const ERC20_ABI = [

    "function decimals() view returns (uint8)",

    "function symbol() view returns (string)",

    "function balanceOf(address account) view returns (uint256)"

];


// ======================================================
// PROVIDERS
// ======================================================

// Provider interno de Trust Wallet.
// SOLO se usa para wallet.

let walletEthereum =
    null;


// BrowserProvider.
// SOLO para signer.

let walletProvider =
    null;


// Provider independiente.
//
// ESTE hace:
//
// eth_getCode
// eth_call
// eth_estimateGas
// receipts
// balances
//
// NO Trust Wallet.

let rpcProvider =
    null;


// ======================================================
// CONTRATOS
// ======================================================

let readContract =
    null;

let tokenContract =
    null;


// ======================================================
// DATOS
// ======================================================

let signer =
    null;

let connectedAddress =
    null;

let contractOwner =
    null;

let currentContractBalance =
    0n;

let USDC_DECIMALS =
    6;

let tokenSymbol =
    "USDC";


// ======================================================
// CONTROL ESTADO
// ======================================================

let isConnecting =
    false;

let isWithdrawing =
    false;


// ======================================================
// HTML
// ======================================================

const walletEl =
    document.getElementById(
        "wallet"
    );

const ownerEl =
    document.getElementById(
        "owner"
    );

const contractAddressEl =
    document.getElementById(
        "contractAddress"
    );

const balanceEl =
    document.getElementById(
        "balance"
    );

const destinationEl =
    document.getElementById(
        "destination"
    );

const amountEl =
    document.getElementById(
        "amount"
    );

const connectBtn =
    document.getElementById(
        "connectBtn"
    );

const refreshBtn =
    document.getElementById(
        "refreshBtn"
    );

const maxBtn =
    document.getElementById(
        "maxBtn"
    );

const withdrawBtn =
    document.getElementById(
        "withdrawBtn"
    );

const withdrawAllBtn =
    document.getElementById(
        "withdrawAllBtn"
    );

const statusEl =
    document.getElementById(
        "status"
    );


// ======================================================
// STATUS
// ======================================================

function setStatus(
    message,
    type = ""
) {

    console.log(message);

    statusEl.className =
        type;

    statusEl.textContent =
        message;

}


function setStatusHTML(
    html,
    type = ""
) {

    statusEl.className =
        type;

    statusEl.innerHTML =
        html;

}


// ======================================================
// ERROR
// ======================================================

function getErrorMessage(error) {

    console.error(
        "ERROR COMPLETO:",
        error
    );


    if (!error) {

        return "Error desconocido.";

    }


    if (
        error.code === 4001 ||
        error.code === "ACTION_REJECTED"
    ) {

        return "Operación rechazada en Trust Wallet.";

    }


    const nestedMessage =

        error?.info?.error?.message ||

        error?.error?.message ||

        error?.data?.message;


    return (

        nestedMessage ||

        error.shortMessage ||

        error.reason ||

        error.message ||

        "Error desconocido."

    );

}


// ======================================================
// DIRECCIÓN CORTA
// ======================================================

function shortAddress(address) {

    if (!address) {
        return "-";
    }


    return (

        address.slice(
            0,
            6
        )

        +

        "..."

        +

        address.slice(
            -4
        )

    );

}


// ======================================================
// VALIDAR CONFIGURACIÓN
// ======================================================

function validateConfiguration() {

    if (
        !ethers.isAddress(
            CONTRACT_ADDRESS
        )
    ) {

        throw new Error(
            "CONTRACT_ADDRESS no es válido."
        );

    }


    if (
        !READ_RPC_URL ||
        READ_RPC_URL.includes(
            "PON_AQUI"
        )
    ) {

        throw new Error(
            "Debes configurar READ_RPC_URL con un RPC de Ethereum Mainnet."
        );

    }

}


// ======================================================
// INICIALIZAR RPC DE LECTURA
// ======================================================

async function initializeReadProvider() {

    validateConfiguration();


    if (rpcProvider) {

        return;

    }


    console.log(
        "🌐 Inicializando RPC independiente..."
    );


    rpcProvider =
        new ethers.JsonRpcProvider(

            READ_RPC_URL,

            1,

            {
                staticNetwork: true
            }

        );


    const network =
        await rpcProvider.getNetwork();


    console.log(
        "RPC chainId:",
        network.chainId.toString()
    );


    if (
        network.chainId !==
        EXPECTED_CHAIN_ID
    ) {

        throw new Error(

            "READ_RPC_URL no está conectado a Ethereum Mainnet. ChainId recibido: "

            +

            network.chainId.toString()

        );

    }


    console.log(
        "✅ RPC independiente conectado"
    );

}


// ======================================================
// DETECTAR TRUST WALLET
// ======================================================

function findTrustWalletProvider() {

    console.log(
        "Buscando Trust Wallet..."
    );


    console.log(
        "window.trustwallet:",
        window.trustwallet
    );


    console.log(
        "window.ethereum:",
        window.ethereum
    );


    // ==============================================
    // Trust Wallet específico
    // ==============================================

    if (
        window.trustwallet &&
        window.trustwallet.ethereum
    ) {

        console.log(
            "✅ Trust Wallet: window.trustwallet.ethereum"
        );

        return window.trustwallet.ethereum;

    }


    // ==============================================
    // Providers múltiples
    // ==============================================

    if (
        window.ethereum &&
        Array.isArray(
            window.ethereum.providers
        )
    ) {

        const found =
            window.ethereum.providers.find(

                p =>

                    p.isTrust === true ||

                    p.isTrustWallet === true

            );


        if (found) {

            console.log(
                "✅ Trust Wallet encontrado en ethereum.providers"
            );

            return found;

        }

    }


    // ==============================================
    // window.ethereum
    // ==============================================

    if (
        window.ethereum &&
        (
            window.ethereum.isTrust === true ||
            window.ethereum.isTrustWallet === true
        )
    ) {

        console.log(
            "✅ Trust Wallet: window.ethereum"
        );

        return window.ethereum;

    }


    return null;

}


// ======================================================
// CREAR CONTRATO DE LECTURA
// ======================================================

async function initializeReadContract() {

    await initializeReadProvider();


    if (!readContract) {

        readContract =
            new ethers.Contract(

                CONTRACT_ADDRESS,

                CONTRACT_ABI,

                rpcProvider

            );

    }

}


// ======================================================
// CARGAR DATOS CONTRATO
// ======================================================

async function loadContractData() {

    await initializeReadContract();


    console.log(
        "======================================"
    );

    console.log(
        "📡 CONSULTANDO DONATION WALLET"
    );


    // ==============================================
    // ETH_GETCODE
    //
    // IMPORTANTE:
    // USA rpcProvider
    // NO TRUST WALLET
    // ==============================================

    const code =
        await rpcProvider.getCode(
            CONTRACT_ADDRESS
        );


    if (
        !code ||
        code === "0x"
    ) {

        throw new Error(

            "No existe un contrato desplegado en "

            +

            CONTRACT_ADDRESS

            +

            " en Ethereum Mainnet."

        );

    }


    console.log(
        "✅ Contrato encontrado"
    );


    // ==============================================
    // DATOS
    // ==============================================

    const [

        owner,

        tokenAddress,

        balance

    ] = await Promise.all([

        readContract.owner(),

        readContract.usdcToken(),

        readContract.getContractBalance()

    ]);


    contractOwner =
        ethers.getAddress(
            owner
        );


    currentContractBalance =
        balance;


    console.log(
        "Owner:",
        contractOwner
    );


    console.log(
        "Token:",
        tokenAddress
    );


    console.log(
        "Balance raw:",
        balance.toString()
    );


    // ==============================================
    // TOKEN
    // ==============================================

    tokenContract =
        new ethers.Contract(

            tokenAddress,

            ERC20_ABI,

            rpcProvider

        );


    try {

        const decimals =
            await tokenContract.decimals();


        USDC_DECIMALS =
            Number(
                decimals
            );

    }

    catch (error) {

        console.warn(
            "No se pudo obtener decimals(). Usando 6.",
            error
        );


        USDC_DECIMALS =
            6;

    }


    try {

        tokenSymbol =
            await tokenContract.symbol();

    }

    catch {

        tokenSymbol =
            "USDC";

    }


    const formattedBalance =
        ethers.formatUnits(

            balance,

            USDC_DECIMALS

        );


    console.log(
        "Balance:",
        formattedBalance,
        tokenSymbol
    );


    console.log(
        "======================================"
    );


    // ==============================================
    // UI
    // ==============================================

    contractAddressEl.textContent =
        CONTRACT_ADDRESS;


    ownerEl.textContent =
        contractOwner;


    balanceEl.textContent =
        formattedBalance;


    // Por defecto poner owner destino
    if (
        !destinationEl
            .value
            .trim()
    ) {

        destinationEl.value =
            contractOwner;

    }


    updateButtons();


    return {

        owner:
            contractOwner,

        balance,

        formattedBalance,

        tokenSymbol

    };

}


// ======================================================
// ACTUALIZAR BOTONES
// ======================================================

function updateButtons() {

    const isOwner =

        connectedAddress &&

        contractOwner &&

        connectedAddress.toLowerCase()
        ===
        contractOwner.toLowerCase();


    const enabled =
        Boolean(isOwner) &&
        !isWithdrawing;


    withdrawBtn.disabled =
        !enabled;


    withdrawAllBtn.disabled =
        !enabled;

}


// ======================================================
// CHAIN DE TRUST WALLET
// ======================================================

async function ensureWalletMainnet() {

    if (!walletEthereum) {

        throw new Error(
            "Trust Wallet no está disponible."
        );

    }


    const chainIdHex =
        await walletEthereum.request({

            method:
                "eth_chainId"

        });


    let chainId =
        BigInt(
            chainIdHex
        );


    console.log(
        "Trust Wallet chain:",
        chainId.toString()
    );


    if (
        chainId ===
        EXPECTED_CHAIN_ID
    ) {

        return;

    }


    setStatus(
        "Cambiando Trust Wallet a Ethereum Mainnet...",
        "warning"
    );


    await walletEthereum.request({

        method:
            "wallet_switchEthereumChain",

        params: [

            {
                chainId:
                    "0x1"
            }

        ]

    });


    const newChain =
        await walletEthereum.request({

            method:
                "eth_chainId"

        });


    chainId =
        BigInt(
            newChain
        );


    if (
        chainId !==
        EXPECTED_CHAIN_ID
    ) {

        throw new Error(
            "Trust Wallet no está conectado a Ethereum Mainnet."
        );

    }

}


// ======================================================
// CONECTAR
// ======================================================

async function connectTrustWallet() {

    if (isConnecting) {

        console.log(
            "Conexión ya en proceso."
        );

        return;

    }


    try {

        isConnecting =
            true;


        connectBtn.disabled =
            true;


        // ==========================================
        // RPC DE LECTURA PRIMERO
        // ==========================================

        setStatus(
            "Comprobando conexión Ethereum..."
        );


        await initializeReadProvider();


        await loadContractData();


        // ==========================================
        // TRUST WALLET
        // ==========================================

        setStatus(
            "Buscando Trust Wallet..."
        );


        walletEthereum =
            findTrustWalletProvider();


        if (!walletEthereum) {

            throw new Error(
                "Trust Wallet no fue detectado."
            );

        }


        // ==========================================
        // SOLICITAR CUENTA
        // ==========================================

        setStatus(
            "Solicitando conexión a Trust Wallet..."
        );


        const accounts =
            await walletEthereum.request({

                method:
                    "eth_requestAccounts"

            });


        if (
            !accounts ||
            accounts.length === 0
        ) {

            throw new Error(
                "No se seleccionó ninguna cuenta."
            );

        }


        connectedAddress =
            ethers.getAddress(
                accounts[0]
            );


        console.log(
            "Wallet:",
            connectedAddress
        );


        // ==========================================
        // RED
        // ==========================================

        await ensureWalletMainnet();


        // ==========================================
        // BROWSER PROVIDER
        //
        // SOLO SIGNER
        // ==========================================

        walletProvider =
            new ethers.BrowserProvider(
                walletEthereum
            );


        signer =
            await walletProvider.getSigner();


        walletEl.textContent =
            connectedAddress;


        // ==========================================
        // OWNER
        // ==========================================

        if (
            !contractOwner
        ) {

            await loadContractData();

        }


        if (
            connectedAddress.toLowerCase()
            !==
            contractOwner.toLowerCase()
        ) {

            updateButtons();


            throw new Error(

                "La wallet conectada NO es el owner. Owner requerido: "

                +

                contractOwner

            );

        }


        connectBtn.textContent =
            "✅ " +
            shortAddress(
                connectedAddress
            );


        updateButtons();


        setStatus(
            "✅ Trust Wallet conectada. Eres el owner del contrato.",
            "success"
        );

    }

    catch (error) {

        console.error(
            "CONNECT ERROR:",
            error
        );


        setStatus(
            "❌ " +
            getErrorMessage(error),
            "error"
        );


        connectBtn.disabled =
            false;

    }

    finally {

        isConnecting =
            false;

    }

}


// ======================================================
// ACCOUNTS CHANGED
// ======================================================

async function handleAccountsChanged(
    accounts
) {

    try {

        console.log(
            "accountsChanged:",
            accounts
        );


        if (
            !accounts ||
            accounts.length === 0
        ) {

            connectedAddress =
                null;

            signer =
                null;

            walletProvider =
                null;


            walletEl.textContent =
                "No conectada";


            connectBtn.textContent =
                "Conectar Trust Wallet";


            connectBtn.disabled =
                false;


            updateButtons();


            setStatus(
                "Trust Wallet desconectada.",
                "warning"
            );


            return;

        }


        const address =
            ethers.getAddress(
                accounts[0]
            );


        // ==========================================
        // MISMA CUENTA
        //
        // NO HACER NADA
        // ==========================================

        if (
            connectedAddress &&
            connectedAddress.toLowerCase()
            ===
            address.toLowerCase()
        ) {

            console.log(
                "ℹ️ accountsChanged recibió la misma cuenta. Ignorado."
            );


            return;

        }


        connectedAddress =
            address;


        walletEl.textContent =
            address;


        // ==========================================
        // RECONSTRUIR SIGNER
        //
        // SIN eth_requestAccounts
        // ==========================================

        if (walletEthereum) {

            walletProvider =
                new ethers.BrowserProvider(
                    walletEthereum
                );


            signer =
                await walletProvider
                    .getSigner();

        }


        // ==========================================
        // LECTURAS
        //
        // RPC EXTERNO
        // ==========================================

        await loadContractData();


        updateButtons();


        if (
            contractOwner &&
            connectedAddress.toLowerCase()
            ===
            contractOwner.toLowerCase()
        ) {

            connectBtn.textContent =
                "✅ " +
                shortAddress(
                    connectedAddress
                );


            setStatus(
                "✅ Cuenta actualizada. Eres el owner.",
                "success"
            );

        }

        else {

            setStatus(
                "❌ La nueva cuenta no es el owner.",
                "error"
            );

        }

    }

    catch (error) {

        console.error(
            "ACCOUNTS CHANGED ERROR:",
            error
        );


        setStatus(
            "❌ " +
            getErrorMessage(error),
            "error"
        );

    }

}


// ======================================================
// CHAIN CHANGED
// ======================================================

async function handleChainChanged(
    chainIdHex
) {

    try {

        console.log(
            "chainChanged:",
            chainIdHex
        );


        const chainId =
            BigInt(
                chainIdHex
            );


        if (
            chainId !==
            EXPECTED_CHAIN_ID
        ) {

            withdrawBtn.disabled =
                true;

            withdrawAllBtn.disabled =
                true;


            setStatus(
                "⚠️ Trust Wallet cambió de red. Selecciona Ethereum Mainnet.",
                "warning"
            );


            return;

        }


        // NO recargar página
        // NO eth_requestAccounts


        const accounts =
            await walletEthereum.request({

                method:
                    "eth_accounts"

            });


        if (
            accounts &&
            accounts.length > 0
        ) {

            connectedAddress =
                ethers.getAddress(
                    accounts[0]
                );


            walletEl.textContent =
                connectedAddress;


            walletProvider =
                new ethers.BrowserProvider(
                    walletEthereum
                );


            signer =
                await walletProvider
                    .getSigner();

        }


        await loadContractData();


        updateButtons();


        setStatus(
            "✅ Ethereum Mainnet activa.",
            "success"
        );

    }

    catch (error) {

        console.error(
            "CHAIN CHANGED ERROR:",
            error
        );


        setStatus(
            "❌ " +
            getErrorMessage(error),
            "error"
        );

    }

}

// ======================================================
// GENERAR DATA DE LA TRANSACCIÓN
// ======================================================

function createTransactionData(
    functionName,
    args = []
) {

    const iface =
        new ethers.Interface(
            CONTRACT_ABI
        );


    return iface.encodeFunctionData(

        functionName,

        args

    );

}


// ======================================================
// SIMULAR Y ESTIMAR GAS
// ======================================================

async function prepareTransaction(
    data
) {

    if (
        !connectedAddress
    ) {

        throw new Error(
            "Wallet no conectada."
        );

    }


    await initializeReadProvider();


    // ==============================================
    // STATIC CALL
    //
    // RPC EXTERNO
    // ==============================================

    console.log(
        "🔎 Simulando..."
    );


    await rpcProvider.call({

        from:
            connectedAddress,

        to:
            CONTRACT_ADDRESS,

        data

    });


    console.log(
        "✅ Simulación correcta"
    );


    // ==============================================
    // GAS
    // ==============================================

    const estimatedGas =
        await rpcProvider
            .estimateGas({

                from:
                    connectedAddress,

                to:
                    CONTRACT_ADDRESS,

                data

            });


    console.log(
        "Gas estimado:",
        estimatedGas.toString()
    );


    // 20% margen

    const gasLimit =

        estimatedGas *
        120n /
        100n;


    console.log(
        "Gas limit:",
        gasLimit.toString()
    );


    return gasLimit;

}


// ======================================================
// ENVIAR CON TRUST WALLET
// ======================================================

async function sendWithTrustWallet(
    data,
    gasLimit
) {

    if (
        !walletEthereum
    ) {

        throw new Error(
            "Trust Wallet no está conectada."
        );

    }


    await ensureWalletMainnet();


    // ==============================================
    // AQUÍ TRUST WALLET SOLO RECIBE
    // LA TRANSACCIÓN FINAL
    // ==============================================

    const transaction = {

        from:
            connectedAddress,

        to:
            CONTRACT_ADDRESS,

        data,

        value:
            "0x0",

        gas:
            ethers.toQuantity(
                gasLimit
            )

    };


    console.log(
        "TX para Trust Wallet:",
        transaction
    );


    const txHash =
        await walletEthereum.request({

            method:
                "eth_sendTransaction",

            params: [

                transaction

            ]

        });


    return txHash;

}


// ======================================================
// ESPERAR TRANSACCIÓN
// ======================================================

async function waitTransaction(
    txHash
) {

    setStatusHTML(

        `⏳ Transacción enviada.<br><br>

        <a
            href="https://etherscan.io/tx/${txHash}"
            target="_blank"
            rel="noopener noreferrer"
        >
            ${txHash}
        </a>

        <br><br>

        Esperando confirmación...`

    );


    // RPC EXTERNO
    const receipt =
        await rpcProvider
            .waitForTransaction(
                txHash
            );


    if (!receipt) {

        throw new Error(
            "No se recibió confirmación de la transacción."
        );

    }


    if (
        receipt.status !==
        1
    ) {

        throw new Error(
            "La transacción fue minada pero falló."
        );

    }


    return receipt;

}


// ======================================================
// RETIRAR CANTIDAD ESPECÍFICA
// ======================================================

async function withdrawToAddress() {

    if (isWithdrawing) {
        return;
    }


    try {

        isWithdrawing =
            true;


        updateButtons();


        if (
            !connectedAddress ||
            !walletEthereum
        ) {

            throw new Error(
                "Primero conecta Trust Wallet."
            );

        }


        // ==========================================
        // OWNER
        // ==========================================

        await loadContractData();


        if (
            connectedAddress.toLowerCase()
            !==
            contractOwner.toLowerCase()
        ) {

            throw new Error(
                "Solo el owner puede retirar."
            );

        }


        // ==========================================
        // DESTINO
        // ==========================================

        const destination =
            destinationEl
                .value
                .trim();


        if (
            !ethers.isAddress(
                destination
            )
        ) {

            throw new Error(
                "Wallet destino inválida."
            );

        }


        const normalizedDestination =
            ethers.getAddress(
                destination
            );


        if (
            normalizedDestination ===
            ethers.ZeroAddress
        ) {

            throw new Error(
                "No puedes enviar a la dirección cero."
            );

        }


        // ==========================================
        // CANTIDAD
        // ==========================================

        const amountText =
            amountEl
                .value
                .trim();


        if (!amountText) {

            throw new Error(
                "Ingresa la cantidad de USDC."
            );

        }


        let amount;


        try {

            amount =
                ethers.parseUnits(

                    amountText,

                    USDC_DECIMALS

                );

        }

        catch {

            throw new Error(
                "Cantidad USDC inválida."
            );

        }


        if (
            amount <= 0n
        ) {

            throw new Error(
                "La cantidad debe ser mayor a cero."
            );

        }


        // ==========================================
        // SALDO
        // ==========================================

        const balance =
            await readContract
                .getContractBalance();


        if (
            amount >
            balance
        ) {

            throw new Error(

                "Saldo insuficiente. Disponible: "

                +

                ethers.formatUnits(

                    balance,

                    USDC_DECIMALS

                )

                +

                " USDC"

            );

        }


        console.log(
            "======================================"
        );

        console.log(
            "💸 RETIRO PARCIAL"
        );

        console.log(
            "Owner:",
            connectedAddress
        );

        console.log(
            "Destino:",
            normalizedDestination
        );

        console.log(
            "Cantidad:",
            amountText,
            "USDC"
        );

        console.log(
            "Raw:",
            amount.toString()
        );

        console.log(
            "======================================"
        );


        // ==========================================
        // DATA
        // ==========================================

        const data =
            createTransactionData(

                "withdrawDonations",

                [

                    normalizedDestination,

                    amount

                ]

            );


        // ==========================================
        // SIMULAR + GAS
        //
        // RPC EXTERNO
        // ==========================================

        setStatus(
            "🔎 Simulando retiro..."
        );


        const gasLimit =
            await prepareTransaction(
                data
            );


        // ==========================================
        // TRUST WALLET
        // ==========================================

        setStatus(

            "🔐 Confirma en Trust Wallet el envío de "

            +

            amountText

            +

            " USDC."

        );


        const txHash =
            await sendWithTrustWallet(

                data,

                gasLimit

            );


        console.log(
            "TX hash:",
            txHash
        );


        // ==========================================
        // CONFIRMACIÓN
        // ==========================================

        await waitTransaction(
            txHash
        );


        // ==========================================
        // ACTUALIZAR
        // ==========================================

        await loadContractData();


        amountEl.value =
            "";


        setStatusHTML(

            `✅ <strong>Retiro completado.</strong>

            <br><br>

            Cantidad:<br>
            ${amountText} USDC

            <br><br>

            Destino:<br>
            ${normalizedDestination}

            <br><br>

            <a
                href="https://etherscan.io/tx/${txHash}"
                target="_blank"
                rel="noopener noreferrer"
            >
                Ver transacción en Etherscan
            </a>`,

            "success"

        );

    }

    catch (error) {

        console.error(
            "WITHDRAW ERROR:",
            error
        );


        setStatus(
            "❌ " +
            getErrorMessage(error),
            "error"
        );

    }

    finally {

        isWithdrawing =
            false;


        updateButtons();

    }

}

// ======================================================
// RESTAURAR CONEXIÓN
// ======================================================

async function restoreWalletConnection() {

    try {

        walletEthereum =
            findTrustWalletProvider();


        if (!walletEthereum) {

            console.log(
                "Trust Wallet no detectado."
            );


            return;

        }


        // ==========================================
        // IMPORTANTE
        //
        // eth_accounts
        // NO eth_requestAccounts
        // ==========================================

        const accounts =
            await walletEthereum.request({

                method:
                    "eth_accounts"

            });


        if (
            !accounts ||
            accounts.length === 0
        ) {

            console.log(
                "Trust Wallet detectado pero no conectado."
            );


            return;

        }


        connectedAddress =
            ethers.getAddress(
                accounts[0]
            );


        walletEl.textContent =
            connectedAddress;


        const chainHex =
            await walletEthereum.request({

                method:
                    "eth_chainId"

            });


        if (
            BigInt(chainHex)
            !==
            EXPECTED_CHAIN_ID
        ) {

            setStatus(
                "⚠️ Trust Wallet está conectado pero no está en Ethereum Mainnet.",
                "warning"
            );


            return;

        }


        walletProvider =
            new ethers.BrowserProvider(
                walletEthereum
            );


        signer =
            await walletProvider
                .getSigner();


        await loadContractData();


        if (
            contractOwner &&
            connectedAddress.toLowerCase()
            ===
            contractOwner.toLowerCase()
        ) {

            connectBtn.textContent =
                "✅ " +
                shortAddress(
                    connectedAddress
                );


            setStatus(
                "✅ Trust Wallet restaurada. Eres el owner.",
                "success"
            );

        }

        else {

            setStatus(
                "⚠️ La cuenta conectada no es el owner.",
                "warning"
            );

        }


        updateButtons();

    }

    catch (error) {

        console.error(
            "RESTORE WALLET ERROR:",
            error
        );


        // Una falla de Trust Wallet aquí
        // NO debe destruir las lecturas RPC.

    }

}

// ======================================================
// LISTENERS TRUST WALLET
// ======================================================

function initializeWalletListeners() {

    walletEthereum =
        findTrustWalletProvider();


    if (!walletEthereum) {

        return;

    }


    // Removemos listeners nuestros si existieran
    // solamente si el provider lo soporta.

    try {

        walletEthereum.removeListener(

            "accountsChanged",

            handleAccountsChanged

        );


        walletEthereum.removeListener(

            "chainChanged",

            handleChainChanged

        );

    }

    catch {
        // Ignorar
    }


    // Registrar una sola vez

    walletEthereum.on(

        "accountsChanged",

        handleAccountsChanged

    );


    walletEthereum.on(

        "chainChanged",

        handleChainChanged

    );


    console.log(
        "✅ Listeners Trust Wallet registrados"
    );

}


// ======================================================
// START
// ======================================================

async function start() {

    try {

        contractAddressEl.textContent =
            CONTRACT_ADDRESS;


        // ==========================================
        // 1. RPC EXTERNO
        // ==========================================

        setStatus(
            "Conectando al RPC Ethereum..."
        );


        await initializeReadProvider();


        // ==========================================
        // 2. DATOS CONTRATO
        // ==========================================

        await loadContractData();


        // ==========================================
        // 3. TRUST WALLET
        // ==========================================

        initializeWalletListeners();


        // ==========================================
        // 4. RESTAURAR SIN POPUP
        // ==========================================

        await restoreWalletConnection();


        if (!connectedAddress) {

            setStatus(
                "✅ Contrato conectado. Pulsa Conectar Trust Wallet.",
                "success"
            );

        }

    }

    catch (error) {

        console.error(
            "START ERROR:",
            error
        );


        setStatus(
            "❌ " +
            getErrorMessage(error),
            "error"
        );

    }

}


start();
